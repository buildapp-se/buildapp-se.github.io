<!doctype html>
<!-- Source for /assets/og-image.png (1200x630).
     Rendera om med:  npx playwright screenshot --viewport-size=1200,630 og.source.html assets/og-image.png -->
<html lang="sv"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--wall:#DFDDD5;--wall-2:#D2CFC5;--ink:#211F1A;--ink-2:#6E6A5D;--line:rgba(33,31,26,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:var(--wall);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
  display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 84px 96px;position:relative;overflow:hidden}
/* trottoarband langst ner, som gatan pa sajten */
.street{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--wall-2);border-top:2px solid var(--line);display:flex}
.street span{flex:1;border-right:2px solid var(--line)}
.street span:last-child{border-right:0}
.brand{display:flex;align-items:center;gap:28px;margin-bottom:34px}
.brand svg{width:104px;height:104px;flex:none}
.wordmark{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:104px;line-height:.86;letter-spacing:-.01em}
.dot{color:#9E2B3E}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:23px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.slugs{display:flex;gap:18px;margin-top:6px;position:relative;z-index:2}
.slugs b{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:26px;color:var(--ink);
  border:2px solid var(--line);border-left:10px solid var(--accent);
  padding:12px 20px;background:var(--wall)}
</style></head><body>
<div class="brand">
  <svg viewBox="0 0 52 52">
    <rect x="1" y="1" width="50" height="50" rx="10" fill="#211F1A"/>
    <polygon points="26,11 40,24 12,24" fill="#DFDDD5"/>
    <rect x="15" y="24" width="22" height="16" fill="#DFDDD5"/>
    <rect x="22" y="30" width="8" height="10" fill="#211F1A"/>
  </svg>
  <div>
    <div class="wordmark">buildapp<span class="dot">.</span>se</div>
    <div class="eyebrow" style="margin-top:14px">en samling småprojekt</div>
  </div>
</div>
<div class="slugs">
  <b style="--accent:#2F6B3F">/sipdeck</b>
  <b style="--accent:#9E2B3E">/grammat</b>
  <b style="--accent:#3D6B7D">/ai</b>
  <b style="--accent:#8A5A2B">/tidslinje</b>
</div>
<div class="street"><span></span><span></span><span></span><span></span><span></span></div>
</body></html>
